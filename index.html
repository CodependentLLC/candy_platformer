<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Candy Quest Kids</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <div class="game-wrap">
      <div class="game-stage">
        <canvas id="gameCanvas" width="960" height="540" aria-label="Candy Quest Kids game canvas"></canvas>

        <div class="game-ui" aria-label="Game controls">
          <button id="heroButton" class="hud-button portrait-toggle secondary" type="button">Boy</button>
          <button id="pauseButton" class="hud-button secondary" type="button">Play</button>
          <button id="soundButton" class="hud-button secondary" type="button">Sound On</button>
          <button id="fullscreenButton" class="hud-button secondary" type="button">Fullscreen</button>
        </div>

        <div class="touch-controls" aria-hidden="true">
          <button data-hold="left">◀</button>
          <button data-hold="right">▶</button>
          <button data-tap="jump" class="jump">Jump</button>
        </div>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
