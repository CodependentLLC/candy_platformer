<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Candy Quest Kids</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <div class="game-wrap">
      <div class="game-stage">
        <canvas id="gameCanvas" width="960" height="540" aria-label="Candy Quest Kids game canvas"></canvas>

        <div class="game-ui" aria-label="Game controls">
          <button id="menuButton" class="hud-button secondary" type="button">Menu</button>
          <button id="heroButton" class="hud-button portrait-toggle secondary" type="button">Boy</button>
          <button id="pauseButton" class="hud-button secondary" type="button">Play</button>
          <button id="soundButton" class="hud-button secondary" type="button">Sound On</button>
          <button id="fullscreenButton" class="hud-button secondary" type="button">Fullscreen</button>
        </div>

        <section id="menuOverlay" class="menu-overlay" aria-label="Main menu">
          <div class="menu-card">
            <p class="menu-kicker">Candy Platform Adventure</p>
            <div class="menu-door" aria-hidden="true"></div>
            <h1>Candy Quest Kids</h1>
            <p class="menu-copy">Pick a hero, continue your run, or head to the candy world map.</p>
            <div class="menu-story">
              <span>Soft platforms</span>
              <span>Friendly candy worlds</span>
              <span>Play at your pace</span>
            </div>
            <div class="menu-heroes" role="group" aria-label="Choose hero">
              <button id="menuBoyButton" class="menu-hero" type="button">Boy</button>
              <button id="menuGirlButton" class="menu-hero" type="button">Girl</button>
            </div>
            <div class="menu-actions">
              <button id="resumeButton" class="secondary" type="button">Resume</button>
              <button id="startButton" type="button">Start Adventure</button>
              <button id="mapButton" class="secondary" type="button">World Map</button>
            </div>
          </div>
        </section>

        <div class="touch-controls" aria-hidden="true">
          <button data-hold="left">◀</button>
          <button data-hold="right">▶</button>
          <button data-tap="jump" class="jump">Jump</button>
        </div>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
